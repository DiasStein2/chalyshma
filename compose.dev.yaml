services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: olympiad
      POSTGRES_USER: olympiad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olympiad_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olympiad -d olympiad"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://olympiad:${POSTGRES_PASSWORD:-olympiad_dev}@db:5432/olympiad
      JWT_SECRET: ${JWT_SECRET:-local-change-me-before-deploying}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
      SEED_LEAD_PASSWORD: ${SEED_LEAD_PASSWORD:-lead1234}
    volumes:
      - ./backend:/app
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  postgres_data:
